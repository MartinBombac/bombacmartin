<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Tonda je gej</title>
  <style>
    :root{
      --bg1:#0f172a; --bg2:#0b1220;
      --accent1:#8b5cf6; --accent2:#06b6d4;
      --glass: rgba(255,255,255,0.06);
      --card-shadow: 0 10px 30px rgba(2,6,23,0.6);
      --radius: 20px;
      --font-sans: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--font-sans);
      background: linear-gradient(135deg,var(--bg1) 0%, var(--bg2) 100%);
      color: #f8fafc;
      display:flex;align-items:center;justify-content:center;
      padding:32px;
    }
    .scene{
      width:100%;max-width:1100px;
      aspect-ratio: 16/9;
      border-radius:calc(var(--radius) + 10px);
      position:relative;
      overflow:hidden;
      box-shadow:var(--card-shadow);
      background: radial-gradient(1200px 600px at 10% 20%, rgba(139,92,246,0.12), transparent 10%),
                  radial-gradient(900px 400px at 90% 80%, rgba(6,182,212,0.08), transparent 12%),
                  linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      display:grid;place-items:center;
    }
    .blob{
      position:absolute;filter:blur(36px);opacity:0.9;mix-blend-mode:screen;transform-origin:center;
      animation: float 8s ease-in-out infinite;
    }
    .blob.a{width:520px;height:520px;left:-120px;top:-60px;background:linear-gradient(45deg,var(--accent1),transparent)}
    .blob.b{width:420px;height:420px;right:-80px;bottom:-40px;background:linear-gradient(45deg,var(--accent2),transparent);animation-duration:9s}
    @keyframes float{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-18px) rotate(6deg)}100%{transform:translateY(0) rotate(0deg)}}

   .card {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px) saturate(120%);
  background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
  border-radius: 16px;
  padding: 48px 64px;
  min-width: 420px;
  max-width: 85%;
  text-align: center;
  box-shadow: 0 8px 30px rgba(2,6,23,0.5);
  line-height: 1.1;
  transform: translateY(2px);
  overflow: visible;   
    }
    h1{
      margin:0;font-size:clamp(28px,6vw,64px);line-height:0.95;font-weight:700;letter-spacing:-0.02em;
      background: linear-gradient(90deg,var(--accent1),var(--accent2));
      -webkit-background-clip:text;background-clip:text;color:transparent;
    }
    .footer{position:absolute;left:18px;bottom:18px;z-index:3;font-size:13px;opacity:0.7}

    @media (max-width:600px){
      .scene{aspect-ratio:auto;height:72vh}
      .card{padding:28px;min-width:unset}
    }
  </style>
</head>
<body>
  <div class="scene" role="main">
    <div class="blob a" aria-hidden></div>
    <div class="blob b" aria-hidden></div>

    <div class="card">
      <h1>Tonda je gej</h1>
    </div>

    
  </div>
</body>
</html>
