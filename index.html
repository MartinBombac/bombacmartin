<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stránka nenalezena | 404</title>
    <style>
        /* Moderní Reset a Font */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f4f7f6;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: #333;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
        }

        /* Animované číslo 404 */
        .error-code {
            font-size: 10rem;
            font-weight: 900;
            line-height: 1;
            color: #2d3436;
            margin-bottom: 20px;
            display: inline-block;
            position: relative;
            animation: float 6s ease-in-out infinite;
        }

        .error-code span {
            color: #007bff; /* Modrá barva pro zvýraznění */
        }

        /* Hlavní text */
        h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards 0.5s;
        }

        p {
            font-size: 1.1rem;
            color: #636e72;
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeIn 1s ease-out forwards 0.8s;
        }

        /* Moderní tlačítko */
        .btn {
            display: inline-block;
            padding: 12px 30px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
            opacity: 0;
            animation: fadeIn 1s ease-out forwards 1.1s;
        }

        .btn:hover {
            background-color: #0056b3;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
        }

        /* Klíčové snímky pro animace */
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Dekorativní pozadí */
        .background-circle {
            position: absolute;
            z-index: -1;
            background: rgba(0, 123, 255, 0.05);
            border-radius: 50%;
            animation: pulse 8s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.2); opacity: 0.1; }
            100% { transform: scale(1); opacity: 0.3; }
        }
    </style>
</head>
<body>

    <div class="background-circle" style="width: 300px; height: 300px; top: -100px; left: -100px;"></div>
    <div class="background-circle" style="width: 400px; height: 400px; bottom: -150px; right: -100px;"></div>

    <div class="container">
        <div class="error-code">4<span>0</span>4</div>
        <h1>Ups! Stránka se někam zatoulala</h1>
        <p>Vypadá to, že adresa, kterou hledáte, už neexistuje nebo byla přesunuta.</p>
        <a href="/" class="btn">Zpět na hlavní stránku</a>
    </div>

</body>
</html>
